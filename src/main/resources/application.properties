server.port=8080

# ===== 工控边缘网关配置 =====
gateway.data-dir=target/gateway-data
gateway.simulator-enabled=false
gateway.simulator-devices=3
gateway.simulator-interval-ms=500
gateway.session-max-pending=100
gateway.archive-capacity=10000
gateway.rate-permits-per-second=20
gateway.rate-burst-capacity=10
gateway.buffer-capacity=20
gateway.wal-max-pending=200
gateway.delivery-max-attempts=3
gateway.delivery-retry-backoff-ms=50
gateway.dead-letter-memory-capacity=1000
gateway.flush-state-per-read=true
