server.port=0

# 本地文件存储（仅本地文件系统，无外部服务）
gateway.spool.dir=./data/spool
gateway.spool.capacity=1000
gateway.rawlog.file=./data/raw/readings.log

# 序列号缺口缓冲（每台设备）
gateway.gap-buffer-capacity=64
# 设备时间戳允许偏离网关时间的上限（毫秒）
gateway.max-clock-skew-millis=60000

# 下游限流（令牌桶）
gateway.rate.permits-per-second=100.0
gateway.rate.burst=200

# 本地端到端演示：java -jar ... --gateway.demo.enabled=true
gateway.demo.enabled=false

# 演示场景建议（命令行覆盖以观察背压）：
# --gateway.spool.capacity=10 --gateway.rate.permits-per-second=5 --gateway.rate.burst=5

